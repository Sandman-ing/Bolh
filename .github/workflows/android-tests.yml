# Проверка каждой правки: модульные тесты, затем настоящая release-сборка
# (с R8) на эмуляторах нескольких версий Android — обновление с прежней
# версии и главные сценарии через экран.
name: Android tests

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Прежняя версия, с которой обновляются пользователи.
  PREVIOUS_BUNDLE: Bolh-0.4.1.aab
  BUNDLETOOL_VERSION: 1.18.1
  BUNDLETOOL_SHA256: 675786493983787ffa11550bdb7c0715679a44e1643f3ff980a529e9c822595c

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Кэш пишется и с веток, иначе каждый прогон качает все библиотеки заново.
          cache-read-only: false

      - name: Maven Central through Google's mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cp .github/gradle/central-mirror.gradle ~/.gradle/init.d/

      - name: Debug key shared by both versions
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Unit and integration tests
        run: bash gradlew --no-daemon testDebugUnitTest

      - name: Release build for the emulator and the tests
        run: bash gradlew --no-daemon :app:assembleE2e :e2e:assembleE2e

      - name: Previous and new version for the emulator
        run: |
          curl -fsSL -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  bundletool.jar" | sha256sum -c -
          # Пакет со всем сразу из .aab, подписанный тем же отладочным ключом.
          universal() {
            java -jar bundletool.jar build-apks --bundle="$1" --output="$RUNNER_TEMP/universal.apks" \
              --overwrite --mode=universal --ks="$HOME/.android/debug.keystore" --ks-pass=pass:android \
              --ks-key-alias=androiddebugkey --key-pass=pass:android
            unzip -p "$RUNNER_TEMP/universal.apks" universal.apk > "$2"
          }
          mkdir -p build/e2e-apks
          universal "$PREVIOUS_BUNDLE" build/e2e-apks/bolh-previous.apk

          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          bundle="Bolh-$version.aab"
          if [ -f "$bundle" ] && [ "$bundle" != "$PREVIOUS_BUNDLE" ]; then
            # Сборка версии уже в репозитории: проверяется тот самый файл, что уйдёт в Play.
            inside=$(java -jar bundletool.jar dump manifest --bundle="$bundle" --xpath=/manifest/@android:versionCode)
            if [ "$inside" != "$code" ]; then
              echo "::error::$bundle has versionCode $inside, but the code says $code"
              exit 1
            fi
            universal "$bundle" build/e2e-apks/bolh-new.apk
            echo "New version: the committed bundle $bundle (versionCode $code)"
          else
            cp app/build/outputs/apk/e2e/app-e2e.apk build/e2e-apks/bolh-new.apk
            echo "New version: the e2e build of this commit"
          fi
          cp e2e/build/outputs/apk/e2e/e2e-e2e.apk build/e2e-apks/bolh-e2e-tests.apk
          ls -la build/e2e-apks

      - name: Both versions share one signature
        run: |
          signer() {
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$1" | grep -m1 "SHA-256 digest"
          }
          previous=$(signer build/e2e-apks/bolh-previous.apk)
          new=$(signer build/e2e-apks/bolh-new.apk)
          echo "previous: $previous"
          echo "new:      $new"
          # Иначе новая версия не встанет поверх прежней и проверка обновления не состоится.
          [ "$previous" = "$new" ]

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/e2e-apks
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: app/build/reports/tests
          retention-days: 14

  emulator:
    name: Emulator API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Самая старая поддерживаемая версия, середина и та, под которую собираем.
          - api: 26
            target: default
          - api: 30
            target: google_apis
          - api: 36
            target: google_apis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: build/e2e-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/e2e.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-api-${{ matrix.api }}
          path: e2e-results
          retention-days: 14
